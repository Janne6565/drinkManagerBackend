# Template for the application secret. Copy to secret.yaml, fill in real
# values, and apply manually (it is gitignored and NOT synced by ArgoCD):
#
#   cp k8s/secret.example.yaml k8s/secret.yaml
#   # edit the values
#   kubectl apply -f k8s/secret.yaml
#
apiVersion: v1
kind: Secret
metadata:
  name: drink-secret
  namespace: christians-drinks
type: Opaque
stringData:
  POSTGRES_DB: drinkmanager
  POSTGRES_USER: drinkmanager
  POSTGRES_PASSWORD: change-me
  APP_ADMIN_USERNAME: admin
  APP_ADMIN_PASSWORD: change-me
