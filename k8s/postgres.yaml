apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: drink-postgres-pvc
  namespace: christians-drinks
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drink-postgres
  namespace: christians-drinks
  labels:
    app: drink-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: drink-postgres
  template:
    metadata:
      labels:
        app: drink-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: drink-secret
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "drinkmanager"]
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: drink-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: drink-postgres
  namespace: christians-drinks
spec:
  selector:
    app: drink-postgres
  ports:
    - port: 5432
      targetPort: 5432
