spring:
  application:
    name: drinkManagerBackend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/drinkmanager}
    username: ${SPRING_DATASOURCE_USERNAME:drinkmanager}
    password: ${SPRING_DATASOURCE_PASSWORD:drinkmanager}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  admin:
    username: ${APP_ADMIN_USERNAME:admin}
    password: ${APP_ADMIN_PASSWORD:changeme}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
